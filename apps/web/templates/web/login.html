<!doctype html>
<html lang="pt-br" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casal Finanças — Entrar</title>

  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme') || 'light';
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(t);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            "background":               "var(--color-background)",
            "surface":                  "var(--color-surface)",
            "surface-container-lowest": "var(--color-surface-container-lowest)",
            "surface-container-low":    "var(--color-surface-container-low)",
            "surface-container":        "var(--color-surface-container)",
            "surface-container-high":   "var(--color-surface-container-high)",
            "on-surface":               "var(--color-on-surface)",
            "on-surface-variant":       "var(--color-on-surface-variant)",
            "outline":                  "var(--color-outline)",
            "outline-variant":          "var(--color-outline-variant)",
            "primary":                  "var(--color-primary)",
            "on-primary":               "var(--color-on-primary)",
            "secondary":                "var(--color-secondary)",
            "secondary-container":      "var(--color-secondary-container)",
            "error":                    "var(--color-error)",
            "error-container":          "var(--color-error-container)",
            "on-error-container":       "var(--color-on-error-container)",
          },
          borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
          spacing: { "xs": "4px", "sm": "8px", "md": "16px", "lg": "24px", "xl": "32px", "xxl": "48px" },
          fontFamily: {
            "headline-lg": ["var(--font-headline)", "sans-serif"],
            "headline-md": ["var(--font-headline)", "sans-serif"],
            "body-md":     ["Inter", "sans-serif"],
            "label-md":    ["Inter", "sans-serif"],
            "label-sm":    ["var(--font-label)", "monospace"],
          },
          fontSize: {
            "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "700" }],
            "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
            "body-md":     ["16px", { lineHeight: "24px", fontWeight: "400" }],
            "body-sm":     ["14px", { lineHeight: "20px", fontWeight: "400" }],
            "label-md":    ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "500" }],
            "label-sm":    ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500" }],
          },
        },
      },
    }
  </script>

  <style>
    :root {
      --color-background:               #fcf8fa;
      --color-surface:                  #fcf8fa;
      --color-surface-container-lowest: #ffffff;
      --color-surface-container-low:    #f6f3f5;
      --color-surface-container:        #f0edef;
      --color-surface-container-high:   #eae7e9;
      --color-on-surface:               #1b1b1d;
      --color-on-surface-variant:       #45464d;
      --color-outline:                  #76777d;
      --color-outline-variant:          #c6c6cd;
      --color-primary:                  #000000;
      --color-on-primary:               #ffffff;
      --color-secondary:                #505f76;
      --color-secondary-container:      #d0e1fb;
      --color-error:                    #ba1a1a;
      --color-error-container:          #ffdad6;
      --color-on-error-container:       #93000a;
      --font-headline: "Inter";
      --font-label:    "Inter";
    }
    .dark {
      --color-background:               #121314;
      --color-surface:                  #121314;
      --color-surface-container-lowest: #0d0e0f;
      --color-surface-container-low:    #1b1c1c;
      --color-surface-container:        #1f2020;
      --color-surface-container-high:   #292a2a;
      --color-on-surface:               #e3e2e2;
      --color-on-surface-variant:       #c4c7c8;
      --color-outline:                  #8e9192;
      --color-outline-variant:          #444748;
      --color-primary:                  #ffffff;
      --color-on-primary:               #2f3131;
      --color-secondary:                #c8c6c5;
      --color-secondary-container:      #474746;
      --color-error:                    #ffb4ab;
      --color-error-container:          #93000a;
      --color-on-error-container:       #ffdad6;
      --font-headline: "Hanken Grotesk";
      --font-label:    "JetBrains Mono";
    }
    body { font-family: "Inter", sans-serif; }
    .dark h1, .dark h2 { font-family: "Hanken Grotesk", sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-lg antialiased">
  <div class="w-full max-w-md">
    <div class="flex flex-col items-center mb-xl">
      <div class="w-14 h-14 rounded-xl bg-primary text-on-primary flex items-center justify-center mb-md">
        <span class="material-symbols-outlined">account_balance_wallet</span>
      </div>
      <h1 class="text-headline-lg font-headline-lg text-primary">Home Flow</h1>
<!--      <p class="text-label-sm text-outline uppercase tracking-wider mt-xs">Shared Ledger</p>-->
    </div>

    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-xl">
      <form method="post" class="space-y-lg">
        {% csrf_token %}
        {% if form.errors %}
          <div class="p-md bg-error-container/30 border border-error rounded-lg text-body-sm text-error flex items-center gap-sm">
            <span class="material-symbols-outlined">error</span>
            Usuário ou senha inválidos.
          </div>
        {% endif %}

        <div>
          <label class="block text-label-sm font-label-md text-outline uppercase tracking-wider mb-sm" for="id_username">Usuário</label>
          <input class="w-full bg-surface-container-lowest border border-outline-variant rounded px-md py-sm text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-colors"
                 type="text" name="username" id="id_username" autofocus required>
        </div>
        <div>
          <label class="block text-label-sm font-label-md text-outline uppercase tracking-wider mb-sm" for="id_password">Senha</label>
          <input class="w-full bg-surface-container-lowest border border-outline-variant rounded px-md py-sm text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-colors"
                 type="password" name="password" id="id_password" required>
        </div>

        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="w-full bg-primary text-on-primary px-lg py-md rounded font-label-md text-label-md hover:opacity-90 active:scale-95 transition-all">
          Entrar
        </button>
      </form>
    </div>
  </div>
</body>
</html>
